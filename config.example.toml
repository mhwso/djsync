# Kopieren nach ~/.config/djsync/config.toml (Windows: %APPDATA%\djsync\config.toml).
# `djsync setup` legt die Datei mit der Client-ID an – alle übrigen Werte sind optional.

# client_id = "deine-32-stellige-client-id"

# Muss exakt so im Spotify-Dashboard als Redirect-URI eingetragen sein
redirect_uri = "http://127.0.0.1:8888/callback"

extensions = [".mp3", ".flac", ".m4a", ".wav", ".aiff", ".aif"]

# Abweichung der Dauer (Sekunden), die für einen exakten Treffer noch erlaubt ist
duration_tolerance_s = 3

# Mindestbewertung (0–1) für einen „ungefähren“ Treffer
min_score = 0.7

# Nicht gefundene Tracks nach so vielen Tagen erneut suchen
retry_missing_days = 14

# Anzahl Kandidaten im Review
review_candidates = 5

[project]
name = "djsync"
version = "0.3.0"
description = "Spiegelt lokale Musikordner als Spotify-Playlists"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "pywebview>=6",
    "rich>=13",
]

[project.scripts]
djsync = "djsync.cli:main"

[project.gui-scripts]
# Fenster-App ohne Konsole (unter Windows); alternativ `python -m djsync.gui`
djsync-gui = "djsync.gui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "djsync"
version = "0.2.0"
description = "Spiegelt lokale Musikordner als Spotify-Playlists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mutagen>=1.47",
    "rich>=13",
]

[project.scripts]
djsync = "djsync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

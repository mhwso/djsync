name: Windows-Release

# Ein Tag wie v0.2.0 baut djsync.exe und hängt sie an ein GitHub-Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # nur zum Anlegen des Releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Tests
        run: |
          python -m pip install --quiet . pytest
          python -m pytest -q

      - name: djsync.exe bauen
        shell: pwsh
        run: .\scripts\build_exe.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: djsync-windows
          path: dist/djsync.exe

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/djsync.exe
          generate_release_notes: true
